<!doctype html>
<!-- Companion mockup: a flat vector cat built as a rig (tail, head, ears, eyelids, pupils, body) so each part
     moves on its own. One card per timer state; all animation is CSS. -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap">
<style>
body{margin:0;background:#efe9dc;font-family:'JetBrains Mono',monospace;color:#2a2420;padding:30px 36px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#7a7066;font-size:13px;margin:0 0 22px}
.row{display:flex;gap:18px;flex-wrap:wrap}
.card{width:230px;background:#f8f2e6;border-radius:22px;padding:14px 14px 12px;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.card.dark{background:#2b2622}
.card svg{display:block;width:100%;height:auto}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.meta b{font-size:14px}
.dark .meta b{color:#f3e7d6}
.pill{font:800 13px 'JetBrains Mono',monospace;color:#d9772b;background:#fff;border-radius:99px;padding:2px 10px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.note{font-size:11px;color:#8a7f74;margin-top:6px;line-height:1.4;height:30px}
.dark .note{color:#a39684}

/* ---------- rig animation ---------- */
.cat *{transform-box:view-box}
.tail{transform-origin:80px 146px;animation:sway 3.2s ease-in-out infinite}
.torso{transform-origin:100px 150px;animation:breathe 3.6s ease-in-out infinite}
.head{transform-origin:100px 94px;animation:tilt 8s ease-in-out infinite}
.earR{transform-origin:116px 50px;animation:flick 6.5s infinite}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 4.6s infinite}
.pupils{animation:look 7s ease-in-out infinite}
.happy,.sleep,.notes,.zz,.sparks,.qm{display:none}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
@keyframes tilt{0%,60%,100%{transform:rotate(0)}70%,85%{transform:rotate(-6deg)}}
@keyframes flick{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-16deg)}94%{transform:rotate(4deg)}}
@keyframes blink{0%,91%,100%{transform:scaleY(0)}94%{transform:scaleY(1)}97%{transform:scaleY(0)}}
@keyframes look{0%,20%,100%{transform:translate(0,0)}30%,45%{transform:translate(-2.6px,.4px)}55%,70%{transform:translate(2.6px,-.4px)}}

/* focus: calm half-closed eyes, slow tail, music notes drift up */
[data-state=focus] .lid{animation:half 6s infinite}
[data-state=focus] .tail{animation-duration:5.5s}
[data-state=focus] .pupils{animation:none;transform:translate(-1.5px,1.5px)}
[data-state=focus] .head{animation:nod 5.5s ease-in-out infinite}
[data-state=focus] .notes{display:block}
.notes text{animation:rise 3.6s linear infinite;opacity:0}
.notes text:nth-child(2){animation-delay:1.8s}
@keyframes half{0%,88%,100%{transform:scaleY(.48)}92%{transform:scaleY(1)}96%{transform:scaleY(.48)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(10px,-34px)}}

/* paused: looks straight at you, ears up, a little question mark */
[data-state=paused] .pupils{animation:none;transform:translate(0,-1px) scale(1.18);transform-origin:100px 68px}
[data-state=paused] .head{animation:tiltQ 4s ease-in-out infinite}
[data-state=paused] .tail{animation-duration:2.4s}
[data-state=paused] .qm{display:block}
.qm text{animation:bob 1.6s ease-in-out infinite}
@keyframes tiltQ{0%,100%{transform:rotate(0)}40%,70%{transform:rotate(7deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* break: curls up asleep, breathing, z z */
[data-state=break] .sit{display:none}
[data-state=break] .sleep,[data-state=break] .zz{display:block}
.sleep .loaf{transform-origin:110px 150px;animation:sleepbreath 3.8s ease-in-out infinite}
@keyframes sleepbreath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.05)}}
.zz text{animation:rise 3.4s linear infinite;opacity:0}
.zz text:nth-child(2){animation-delay:1.7s}

/* done: happy eyes, a few hops, sparkles */
[data-state=done] .eyes{display:none}
[data-state=done] .happy,[data-state=done] .sparks{display:block}
[data-state=done] .sit{transform-origin:100px 150px;animation:hop 1.1s cubic-bezier(.3,.7,.4,1) infinite}
[data-state=done] .tail{animation-duration:.9s}
.sparks path{transform-box:fill-box;transform-origin:center;animation:twinkle 1.1s ease-in-out infinite}
.sparks path:nth-child(2){animation-delay:.35s}.sparks path:nth-child(3){animation-delay:.7s}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.03,.97)}12%{transform:translateY(0) scale(.97,1.04)}40%{transform:translateY(-18px) scale(.98,1.02)}70%{transform:translateY(0) scale(1.05,.95)}}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.1);opacity:1}}
@media (prefers-reduced-motion: reduce){.cat *{animation:none!important}}
</style>
<body>
<h1>Focus MN companion: "Biscuit", animated mockup</h1>
<p class="sub">An original flat cat in the style of your references. Each card is live: tail, blink, ears, head and breathing all move on their own.</p>
<div class="row" id="row"></div>
<template id="cat">
<svg class="cat" viewBox="0 0 200 172" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="102" cy="152" rx="50" ry="5" fill="rgba(80,50,20,.14)"/>
  <!-- sitting pose -->
  <g class="sit">
    <path class="tail" d="M82 146 C52 148 38 128 44 104 C47 92 56 86 61 92" fill="none" stroke="#f08a3c" stroke-width="11" stroke-linecap="round"/>
    <path class="tail" d="M46 112 l7 1 M45 122 l7-1" stroke="#a9481c" stroke-width="5" stroke-linecap="round" style="animation-name:sway"/>
    <g class="torso">
      <path d="M68 150 C63 118 72 92 100 88 C129 92 138 118 134 150 Z" fill="#f08a3c"/>
      <path d="M124 104 c6 4 9 10 10 16 c-6-2-9-7-10-16 Z M128 124 c5 3 7 9 7 15 c-5-2-8-7-7-15 Z" fill="#a9481c"/>
      <rect x="86" y="116" width="10" height="34" rx="5" fill="#f08a3c"/>
      <rect x="104" y="116" width="10" height="34" rx="5" fill="#f08a3c"/>
      <path d="M91 128 v20 M109 128 v20" stroke="#a9481c" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
      <path d="M87 150 q2-4 4 0 q2-4 4 0 M105 150 q2-4 4 0 q2-4 4 0" stroke="#5a2410" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </g>
    <g class="head">
      <path d="M77 58 L80 30 L97 48 Z" fill="#f08a3c"/><path d="M81 52 L82 37 L91 47 Z" fill="#ffb4a0"/>
      <g class="earR"><path d="M123 58 L120 30 L103 48 Z" fill="#f08a3c"/><path d="M119 52 L118 37 L109 47 Z" fill="#ffb4a0"/></g>
      <rect x="72" y="44" width="56" height="48" rx="21" fill="#f08a3c"/>
      <path d="M96 46 v6 M100 45 v8 M104 46 v6" stroke="#a9481c" stroke-width="2.4" stroke-linecap="round"/>
      <g class="eyes">
        <circle cx="89" cy="68" r="7.2" fill="#fff"/><circle cx="111" cy="68" r="7.2" fill="#fff"/>
        <g class="pupils"><circle cx="89" cy="68" r="3.6" fill="#241a16"/><circle cx="111" cy="68" r="3.6" fill="#241a16"/>
          <circle cx="90.2" cy="66.6" r="1" fill="#fff"/><circle cx="112.2" cy="66.6" r="1" fill="#fff"/></g>
        <rect class="lid" x="81" y="60.5" width="16" height="15" fill="#f08a3c"/><rect class="lid" x="103" y="60.5" width="16" height="15" fill="#f08a3c"/>
      </g>
      <g class="happy" fill="none" stroke="#241a16" stroke-width="2.6" stroke-linecap="round">
        <path d="M83 70 q6-8 12 0"/><path d="M105 70 q6-8 12 0"/>
      </g>
      <path d="M97.5 76 h5 l-2.5 3 Z" fill="#e2566a"/>
      <path d="M100 79 q-2.5 3.5-5 1 M100 79 q2.5 3.5 5 1" stroke="#5a2410" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <path d="M86 78 l-15-2 M86 81 l-14 2 M114 78 l15-2 M114 81 l14 2" stroke="#fff4e4" stroke-width="1.2" stroke-linecap="round"/>
      <ellipse cx="80" cy="79" rx="3.6" ry="2" fill="#ff8f7a" opacity=".55"/><ellipse cx="120" cy="79" rx="3.6" ry="2" fill="#ff8f7a" opacity=".55"/>
    </g>
  </g>
  <!-- sleeping pose -->
  <g class="sleep">
    <g class="loaf">
      <path d="M62 150 C60 120 92 108 122 111 C148 114 156 138 150 150 Z" fill="#f08a3c"/>
      <path d="M118 116 c5 4 8 9 9 14 c-5-2-8-6-9-14 Z M134 120 c4 4 6 9 6 14 c-4-2-6-6-6-14 Z" fill="#a9481c"/>
    </g>
    <path d="M148 146 C156 160 108 162 86 151" fill="none" stroke="#f08a3c" stroke-width="10" stroke-linecap="round"/>
    <path d="M58 122 L60 102 L72 116 Z M84 122 L83 102 L71 114 Z" fill="#f08a3c"/>
    <rect x="50" y="112" width="44" height="38" rx="17" fill="#f08a3c"/>
    <path d="M58 132 q5 4 10 0 M76 132 q5 4 10 0" stroke="#241a16" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M69.5 138 h4 l-2 2.4 Z" fill="#e2566a"/>
  </g>
  <g class="notes" fill="#d9772b" font-family="JetBrains Mono" font-weight="800" font-size="15"><text x="132" y="60">♪</text><text x="140" y="70">♫</text></g>
  <g class="zz" fill="#7c8fd0" font-family="JetBrains Mono" font-weight="800"><text x="96" y="104" font-size="14">z</text><text x="104" y="100" font-size="10">z</text></g>
  <g class="qm"><text x="128" y="40" fill="#d9772b" font-family="JetBrains Mono" font-weight="800" font-size="17">?</text></g>
  <g class="sparks" fill="#f5b829">
    <path d="M52 52 l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/><path d="M150 38 l2.4 5.6 5.6 2.4-5.6 2.4-2.4 5.6-2.4-5.6-5.6-2.4 5.6-2.4z"/><path d="M156 92 l2 4.6 4.6 2-4.6 2-2 4.6-2-4.6-4.6-2 4.6-2z"/>
  </g>
</svg>
</template>
<script>
const states = [
  ['idle', 'Idle', '25:00', 'Looks around, blinks, flicks an ear, sways its tail.'],
  ['focus', 'Focus', '24:13', 'Half-closed calm eyes, slow tail, gentle nod; notes drift up while the radio plays.'],
  ['paused', 'Paused', '24:13', 'Looks right at you with big eyes and tilts its head.'],
  ['break', 'Break', '04:59', 'Curls up into a loaf and naps, breathing slowly.'],
  ['done', 'Done!', '25:00', 'Happy eyes, little hops and sparkles.'],
];
const q = new URLSearchParams(location.search);
for (const [s, label, time, note] of states) {
  for (const dark of q.has('dark') ? [false, true] : [false]) {
    const card = document.createElement('div'); card.className = 'card' + (dark ? ' dark' : '');
    const svg = document.getElementById('cat').content.firstElementChild.cloneNode(true);
    svg.dataset.state = s;
    card.append(svg);
    card.insertAdjacentHTML('beforeend', `<div class="meta"><b>${label}</b><span class="pill">${time}</span></div><div class="note">${note}</div>`);
    document.getElementById('row').append(card);
  }
}
</script>
</body>
