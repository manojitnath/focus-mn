<!doctype html>
<!-- Drafts, round two: the white Recorder with real depth (bevels, raised keys, recessed screen, shadows),
     and a tall Classic XXS after the compact-Mac reference. Sized in em; --s sets the scale. -->
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,500;0,600;0,800;1,800&display=swap">
<style>
body{margin:0;background:#f1eee6;color:#26232c;font-family:'JetBrains Mono',monospace;padding:30px 38px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#77737f;font-size:13px;margin:0 0 20px}
h2{font-size:15px;margin:22px 0 12px;color:#d9772b}
.tile{border-radius:20px;padding:34px 40px 26px;display:flex;gap:40px;align-items:flex-end;background:#ececea;width:max-content}
.tile.warm{background:#f1f0ee}
.cap{font-size:11px;color:#77737f;text-align:center;margin-top:12px}
.item{display:flex;flex-direction:column;align-items:center}

/* ---------- Recorder (white) ---------- */
.rec{font-size:var(--s);width:15em;height:20.6em;position:relative;border-radius:1.8em;
  background:linear-gradient(155deg,#ffffff 0%,#f6f6f4 45%,#e9e8e4 100%);
  box-shadow:0 1.6em 2.4em -.4em rgba(0,0,0,.28),0 .35em .6em rgba(0,0,0,.14),
    inset .14em .14em 0 #ffffff,inset -.12em -.1em .25em rgba(0,0,0,.07),inset 0 -.6em 0 #d8d7d2,inset 0 -.68em .35em rgba(0,0,0,.08)}
.rec .well{position:absolute;left:.7em;right:.7em;top:.7em;height:9.5em;border-radius:1.15em;padding:.16em;
  background:linear-gradient(#c9c8c3,#fafaf9);box-shadow:inset 0 .06em .12em rgba(0,0,0,.25)}
.rec .screen{position:relative;height:100%;border-radius:1em;background:radial-gradient(120% 90% at 30% 0%,#2a2a2d,#161618 70%);
  box-shadow:inset 0 .25em .6em rgba(0,0,0,.85),inset 0 -.05em 0 rgba(255,255,255,.05);overflow:hidden}
.rec .screen:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.09) 0 32%,transparent 32.5%)}
.rec .lbl{position:absolute;left:1.25em;top:1.05em;font:600 .6em 'JetBrains Mono';letter-spacing:.08em;color:#ececec;display:flex;align-items:center;gap:.5em}
.rec .lbl i{width:.62em;height:.62em;border-radius:50%;background:#ff6a2b;box-shadow:0 0 .55em #ff6a2b}
.rec .fm{position:absolute;right:1.25em;top:1.05em;font:500 .6em 'JetBrains Mono';color:#8d8d90;letter-spacing:.06em}
.rec .wave{position:absolute;left:.8em;right:.8em;top:2em;height:3.5em;display:flex;align-items:center;justify-content:space-between}
.rec .wave b{display:block;width:.1em;border-radius:.05em;background:#f2f2f2;box-shadow:0 0 .2em rgba(255,255,255,.25)}
.rec .wave b.rest{height:.1em!important;background:#6d6d70;box-shadow:none}
.rec .head{position:absolute;top:1.9em;height:3.7em;width:.1em;background:#ff6a2b;box-shadow:0 0 .45em rgba(255,106,43,.7)}
.rec .time{position:absolute;left:.25em;bottom:.08em;font:300 2.55em/1 'JetBrains Mono';color:#f6f6f6;letter-spacing:-.03em;text-shadow:0 0 .15em rgba(255,255,255,.25)}
.rec .grille{position:absolute;left:1em;right:1em;top:10.75em;height:1.9em;
  background:radial-gradient(circle at 50% 40%,#9e9d98 .06em,#d6d5d0 .075em,transparent .1em) 0 0/.34em .34em}
.rec .tray{position:absolute;left:.7em;right:.7em;top:13.05em;height:5.6em;border-radius:.85em;padding:.14em;
  background:linear-gradient(#3f3f44,#56565b);box-shadow:inset 0 .12em .25em rgba(0,0,0,.6),0 .06em 0 #fff}
.rec .keys{height:100%;display:grid;grid-template-columns:1fr 1fr .95fr;grid-template-rows:1fr 1fr;gap:.13em}
.rec .k{border-radius:.62em;display:grid;place-items:center;
  background:linear-gradient(170deg,#ffffff,#f1f0ed 55%,#e3e2de);
  box-shadow:inset 0 .09em 0 #fff,inset 0 -.16em 0 #d2d1cc,0 .1em .18em rgba(0,0,0,.35)}
.rec .k.big{grid-row:span 2}
.rec .ring{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,#e2e1dd,#fbfbfa 70%);box-shadow:inset 0 .1em .18em rgba(0,0,0,.18),0 .05em 0 #fff}
.rec .sring{width:1.3em;height:1.3em;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 30%,#e2e1dd,#fbfbfa 70%);box-shadow:inset 0 .07em .14em rgba(0,0,0,.18),0 .04em 0 #fff}
.rec .rdot{width:.62em;height:.62em;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff9a62,#ff6a2b 60%,#e2521a);box-shadow:0 0 .4em rgba(255,106,43,.5)}
.rec .sq{width:.5em;height:.5em;border-radius:.07em;background:linear-gradient(#6a6a6e,#4e4e52)}
.rec .tri{width:0;height:0;border-left:.36em solid #6e6e72;border-top:.23em solid transparent;border-bottom:.23em solid transparent;margin-left:.08em}
.rec .bars{display:flex;gap:.1em}.rec .bars i{width:.11em;height:.38em;border-radius:.03em;background:#6e6e72}
.rec .foot{position:absolute;left:1.35em;right:1.35em;bottom:.62em;height:.44em;display:flex;align-items:center;gap:.3em}
.rec .slot{width:1.8em;height:.44em;border-radius:1em;background:#2a2a2e;box-shadow:inset 0 .08em .12em rgba(0,0,0,.8),0 .05em 0 rgba(255,255,255,.6)}
.rec .sw{margin-left:auto;width:1.75em;height:.44em;border-radius:1em;background:#2a2a2e;position:relative;box-shadow:inset 0 .08em .12em rgba(0,0,0,.8)}
.rec .sw:after{content:"";position:absolute;right:-.02em;top:-.06em;width:1.05em;height:.56em;border-radius:1em;background:linear-gradient(#ffa063,#ff6a2b);box-shadow:0 .06em .1em rgba(0,0,0,.3),inset 0 .05em 0 rgba(255,255,255,.5)}

/* ---------- Classic XXS (tall compact Mac) ---------- */
.mac{font-size:var(--s);width:9.4em;height:15.2em;position:relative;border-radius:.55em;
  background:linear-gradient(160deg,#f1ede4,#e7e2d7 55%,#ddd7ca);
  box-shadow:0 1.3em 1.8em -.5em rgba(0,0,0,.28),0 .25em .4em rgba(0,0,0,.14),inset .1em .1em 0 #faf8f3,inset -.08em 0 .12em rgba(0,0,0,.06)}
.mac .bez{box-sizing:border-box;position:absolute;left:1.15em;right:1.15em;top:1.1em;height:7.3em;border-radius:.85em;padding:.55em;
  background:linear-gradient(#cfc8ba,#eae5da 45%,#f6f2ea);box-shadow:inset 0 .18em .3em rgba(0,0,0,.25),inset 0 -.06em 0 #fffdf8,0 .05em 0 rgba(255,255,255,.7)}
.mac .scr{height:100%;border-radius:.4em;background:radial-gradient(120% 90% at 30% 0%,#1e2022,#0e0f10 70%);
  box-shadow:inset 0 .12em .3em rgba(0,0,0,.9);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.08em}
.mac .scr:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.08) 0 30%,transparent 30.5%)}
.mac .scr u{font:800 .62em 'JetBrains Mono';text-decoration:none;color:#ece9df;letter-spacing:.06em}
.mac .scr b{font:800 1.55em/1 'JetBrains Mono';color:#eef0f2;letter-spacing:-.03em;text-shadow:0 0 .2em rgba(255,255,255,.2)}
.mac .seam{position:absolute;left:0;right:0;top:9.35em;height:.07em;background:rgba(0,0,0,.12);box-shadow:0 .05em 0 rgba(255,255,255,.7)}
.mac .slot{position:absolute;right:1.1em;top:9.05em;width:3.5em;height:.36em;border-radius:.06em;background:#151515;box-shadow:inset 0 .08em .1em rgba(0,0,0,.9),0 .04em 0 rgba(255,255,255,.6)}
.mac .ledge{position:absolute;left:0;right:0;top:9.55em;height:2.75em;border-radius:.2em .2em .3em .3em;
  background:linear-gradient(#f3efe6,#e6e1d5);box-shadow:inset 0 .07em 0 #fffdf8,0 .14em .18em rgba(0,0,0,.18)}
.mac .badge{position:absolute;left:.95em;top:.75em;width:.95em;height:.95em;border-radius:.2em;overflow:hidden;box-shadow:0 0 0 .07em #2a3a6a,0 .06em .1em rgba(0,0,0,.3);
  background:linear-gradient(#ffd23a 0 33%,#e8382f 33% 66%,#2f63d6 66%)}
.mac .base{position:absolute;left:.12em;right:.12em;top:12.4em;bottom:0;border-radius:0 0 .5em .5em;
  background:linear-gradient(#e0dbcf,#d8d2c4);box-shadow:inset 0 .12em .2em rgba(0,0,0,.12)}
.mac.dark{background:linear-gradient(160deg,#4b4845,#3e3b39 55%,#33312f);box-shadow:0 1.3em 1.8em -.5em rgba(0,0,0,.4),0 .25em .4em rgba(0,0,0,.2),inset .1em .1em 0 #5c5956}
.mac.dark .bez{background:linear-gradient(#262422,#33312f 45%,#3d3a37);box-shadow:inset 0 .18em .3em rgba(0,0,0,.5),0 .05em 0 rgba(255,255,255,.08)}
.mac.dark .ledge{background:linear-gradient(#4a4744,#3d3a38);box-shadow:inset 0 .07em 0 #5a5754,0 .14em .18em rgba(0,0,0,.3)}
.mac.dark .base{background:linear-gradient(#363432,#2f2d2b)}
.mac.dark .seam{box-shadow:0 .05em 0 rgba(255,255,255,.08)}
</style>
<body>
<h1>Focus MN: hardware skin drafts, round two</h1>
<p class="sub">Shown at 2× and actual size. Drafts only.</p>
<h2>Recorder</h2>
<div class="tile"><div class="item" data-rec data-s="20" data-cap="2×"></div><div class="item" data-rec data-s="9.4" data-cap="actual, 141 × 194"></div></div>
<h2>Classic XXS</h2>
<div class="tile warm">
  <div class="item" data-mac="" data-s="20" data-cap="2×"></div>
  <div class="item" data-mac="dark" data-s="20" data-cap="2× dark"></div>
  <div class="item" data-mac="" data-s="10" data-cap="actual, 94 × 152"></div>
  <div class="item" data-mac="dark" data-s="10" data-cap="actual, dark"></div>
</div>
<script>
const N = 34, PROGRESS = .62;
let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
const heights = Array.from({length: N}, (_, i) => 18 + rnd() * 70 * (0.55 + 0.45 * Math.sin(i / 3.2) ** 2));
const recorder = () => `<div class="rec">
  <div class="well"><div class="screen"><div class="lbl">FOCUS<i></i></div><div class="fm">FM 88.6</div>
    <div class="wave">${heights.map((h, i) => i / N < PROGRESS ? `<b style="height:${h}%"></b>` : '<b class="rest"></b>').join('')}</div>
    <div class="head" style="left:calc(.8em + (100% - 1.6em) * ${PROGRESS})"></div><div class="time">24:13</div></div></div>
  <div class="grille"></div>
  <div class="tray"><div class="keys">
    <div class="k big"><span class="ring"><span class="rdot"></span></span></div>
    <div class="k big"><span class="ring"><span class="sq"></span></span></div>
    <div class="k"><span class="sring"><span class="tri"></span></span></div>
    <div class="k"><span class="sring"><span class="bars"><i></i><i></i></span></span></div></div></div>
  <div class="foot"><span class="slot"></span><span class="slot"></span><span class="sw"></span></div></div>`;
const mac = kind => `<div class="mac ${kind}"><div class="bez"><div class="scr"><u>Focus.</u><b>24:13</b></div></div>
  <div class="seam"></div><div class="slot"></div><div class="ledge"><div class="badge"></div></div><div class="base"></div></div>`;
document.querySelectorAll('[data-rec],[data-mac]').forEach(el => {
  el.style.setProperty('--s', el.dataset.s + 'px');
  el.innerHTML = (el.hasAttribute('data-rec') ? recorder() : mac(el.dataset.mac)) + `<div class="cap">${el.dataset.cap}</div>`;
});
</script>
</body>
