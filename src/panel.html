<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus MN</title>
<style>
:root{--ink:#1d1d1f;--muted:#6e6e73;--card:rgba(255,255,255,.72);--line:rgba(0,0,0,.08);--btn:#1d1d1f;--btnInk:#fff;--btn2:#fff;--accent:#e8743b;--break:#0a84ff;--field:rgba(0,0,0,.05)}
@media (prefers-color-scheme: dark){:root{--ink:#f5f5f7;--muted:#98989d;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.1);--btn:#f5f5f7;--btnInk:#1d1d1f;--btn2:rgba(255,255,255,.1);--break:#64d2ff;--field:rgba(255,255,255,.08)}}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font:13px/1.35 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;cursor:default}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
/* In a browser the panel sits on a fake desktop; in the app the window draws the frosted background. */
body.preview{background:linear-gradient(160deg,#34463d,#1f2a24 60%,#2b2a33);min-height:100vh;padding:30px}
body.preview .panel{background:rgba(246,245,243,.9);border-radius:16px;box-shadow:0 22px 50px rgba(0,0,0,.45);width:320px}
@media (prefers-color-scheme: dark){body.preview .panel{background:rgba(36,36,38,.92)}}
.panel{width:320px;padding:16px;display:flex;flex-direction:column;gap:12px}
[hidden]{display:none!important}

.head{display:flex;justify-content:space-between;align-items:flex-start}
.state{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.state i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.state i.idle{background:var(--muted);opacity:.5}
.break .state i{background:var(--break)}
.paused .state i{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.time{font:800 46px/1.05 -apple-system,system-ui;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.time.long{font-size:40px}
.icon{width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--muted);box-shadow:0 0 0 .5px var(--line)}
.icon:hover{color:var(--ink)}
.icon svg{width:15px;height:15px}
.prog{height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:9px;background:var(--accent);transition:width .25s linear}
.break .prog i{background:var(--break)}
.progmeta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:-6px}
.seg{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;background:var(--line);border-radius:9px;padding:2px;font-size:12.5px;font-weight:600;text-align:center}
.seg button{padding:5px 0;border-radius:7px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.np{background:var(--card);border-radius:13px;padding:10px;display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;box-shadow:0 0 0 .5px var(--line)}
.art{width:64px;height:64px;border-radius:9px;position:relative;overflow:hidden;background:linear-gradient(160deg,#f6b26b,#c56b8a 55%,#5b4b8a)}
.art .mark{position:absolute;inset:0;display:grid;place-items:center;font:800 22px -apple-system,system-ui;color:rgba(255,255,255,.9)}
.ytbox{position:absolute;inset:0;opacity:0;transition:opacity .4s}
.ytbox iframe{position:absolute;left:50%;top:50%;width:114px;height:64px;transform:translate(-50%,-50%);border:0;pointer-events:none}
.playing .ytbox{opacity:1}
.live{position:absolute;left:4px;top:4px;font-size:8.5px;font-weight:800;color:#fff;background:#ff3b30;border-radius:4px;padding:1px 4px;z-index:2;letter-spacing:.04em;display:none}
.playing .live{display:block}
.np b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np small{font-size:11.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:10px;margin-top:6px}
.ctl button{display:grid;place-items:center;width:22px;height:22px;border-radius:6px}
.ctl button:hover{background:var(--line)}
.ctl svg{width:14px;height:14px}.ctl .pp svg{width:18px;height:18px}
.vol{display:flex;align-items:center;gap:5px;margin-left:auto;color:var(--muted)}.vol svg{width:12px;height:12px}
.vol input{width:62px;-webkit-appearance:none;appearance:none;height:4px;border-radius:9px;background:var(--line);outline:none}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 1px 2px rgba(0,0,0,.3)}

.msg{font-size:13.5px;color:var(--muted);text-align:center;margin:2px 4px;min-height:18px}
.primary{background:var(--btn);color:var(--btnInk);border-radius:99px;padding:11px 0;text-align:center;font-weight:700;font-size:15px;width:100%}
.primary:active,.secondary:active{transform:scale(.985)}
.secondary{align-self:center;background:var(--btn2);border-radius:99px;padding:8px 22px;font-weight:600;font-size:13.5px;box-shadow:0 0 0 .5px var(--line),0 1px 2px rgba(0,0,0,.06)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:12px;padding:9px 10px;box-shadow:0 0 0 .5px var(--line)}
.stat small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:17px;font-weight:700;margin:2px 0 1px;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:.5px solid var(--line);padding:10px 2px 0}
.foot button:hover{color:var(--ink)}

/* questions at the end of a session */
.ask{display:flex;flex-direction:column;gap:12px}
.ask h2{margin:0;font-size:19px;font-weight:700}
.ask p{margin:-6px 0 0;color:var(--muted)}
.ask input[type=text]{width:100%;padding:9px 11px;border-radius:9px;border:0;background:var(--field);box-shadow:inset 0 0 0 .5px var(--line);outline:none;font-size:14px}
.ask input[type=text]:focus{box-shadow:inset 0 0 0 .5px var(--line),0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.ask input.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--card);box-shadow:0 0 0 .5px var(--line);border-radius:99px;padding:4px 10px;font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips button:hover{background:var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .secondary{width:100%;padding:10px 0;align-self:stretch;text-align:center}
.row2 .primary{padding:10px 0;font-size:14px}
</style>
</head>
<body>
<div class="panel" id="panel">
  <div id="main">
    <div class="head">
      <div><div class="state"><i id="dot" class="idle"></i><span id="state">Ready</span></div><div class="time" id="time">20:00</div></div>
      <button class="icon" id="gear" type="button" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div style="height:12px"></div>
    <div id="progWrap" hidden><div class="prog"><i id="prog"></i></div><div class="progmeta" style="margin-top:6px"><span id="progA"></span><span id="progB"></span></div><div style="height:12px"></div></div>
    <div class="seg" id="seg">
      <button type="button" data-m="free">Count up</button><button type="button" data-m="20">20</button><button type="button" data-m="40">40</button><button type="button" data-m="60">60</button>
    </div>
    <div style="height:12px" id="segGap"></div>
    <div class="np" id="np">
      <div class="art"><span class="mark" id="mark">FM</span><div class="ytbox"><div id="ytFrame"></div></div><span class="live">LIVE</span></div>
      <div style="min-width:0">
        <b id="stName">Lofi Girl: Study</b><small id="stSub">FM 88.6</small>
        <div class="ctl">
          <button type="button" id="prevSt" title="Previous station"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12L2.5 12zM21 6v12l-8.5-6z"/></svg></button>
          <button type="button" class="pp" id="radioBtn" title="Play or pause the radio"></button>
          <button type="button" id="nextSt" title="Next station"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8.5-6zM3 6v12l8.5-6z"/></svg></button>
          <span class="vol"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/></svg><input type="range" id="vol" min="0" max="100" aria-label="Volume"></span>
        </div>
      </div>
    </div>
    <div style="height:12px"></div>
    <div class="msg" id="msg"></div>
    <div style="height:10px"></div>
    <button class="primary" id="primary" type="button">Start Focus</button>
    <div style="display:flex;justify-content:center;margin-top:10px" id="secWrap"><button class="secondary" id="secondary" type="button">Stop</button></div>
    <div style="height:12px"></div>
    <div class="stats">
      <div class="stat"><small>Today</small><b id="tToday">0m</b><span id="tTodayN">0 sessions</span></div>
      <div class="stat"><small>Streak</small><b id="tStreak">0</b><span>days</span></div>
      <div class="stat"><small>This week</small><b id="tWeek">0m</b><span id="tWeekN">0 sessions</span></div>
    </div>
  </div>

  <form class="ask" id="topicAsk" hidden autocomplete="off">
    <h2>What was this session?</h2>
    <p id="sessLine"></p>
    <input type="text" id="topicInput" list="topicList" maxlength="80" placeholder="e.g. AWS AI Practitioner, Domain 2">
    <datalist id="topicList"></datalist>
    <div class="chips" id="chips"></div>
    <div class="row2"><button class="secondary" id="discardBtn" type="button">Discard</button><button class="primary" type="submit">Save</button></div>
  </form>

  <div class="ask" id="breakAsk" hidden>
    <h2>Take a break?</h2>
    <p id="breakText"></p>
    <div class="row2"><button class="secondary" id="skipBreakBtn" type="button">Skip</button><button class="primary" id="takeBreakBtn" type="button">Take break</button></div>
  </div>

  <div class="foot"><button type="button" id="openLog">Open Log</button><button type="button" id="openSettings">Settings</button><button type="button" id="quit">Quit</button></div>
</div>

<script>
const $ = s => document.querySelector(s);
// YouTube stations play a channel's live stream. A stream's ID changes when the channel restarts it, so each station
// also names its channel and words from the stream's title; the app looks up the current ID on launch and whenever
// a stream fails. yt is the last known ID.
const STATIONS = [
  {name:'Lofi Girl: Study',     f:88.6,  ch:'LofiGirl',      match:['lofi hip hop radio', 'study'], yt:'rFZHOHl-L8A'},
  {name:'Lofi Girl: Jazz',      f:90.4,  ch:'LofiGirl',      match:['jazz lofi radio'],           yt:'E2vONfzoyRI'},
  {name:'Lofi Girl: Piano',     f:92.2,  ch:'LofiGirl',      match:['piano radio'],               yt:'N0snMcR6aaA'},
  {name:'Lofi Girl: Asian',     f:94.0,  ch:'LofiGirl',      match:['asian lofi radio'],          yt:'1Tl2FtV06qo'},
  {name:'Lofi Girl: Rainy',     f:95.8,  ch:'LofiGirl',      match:['sad lofi radio'],            yt:'CwPCy1GLS38'},
  {name:'Lofi Girl: Synthwave', f:97.6,  ch:'LofiGirl',      match:['synthwave radio'],           yt:'4xDzrJKXOOY'},
  {name:'Chillhop: Radio',      f:99.4,  ch:'ChillhopMusic', match:['chillhop radio'],            yt:'5yx6BWlEVcY'},
  {name:'Chillhop: Late Night', f:101.2, ch:'ChillhopMusic', match:['late night vibes'],          yt:'i6WzngxTnBA'},
  {name:'Steezyasfuck: Lofi',   f:102.8, ch:'steezyasfvck',  match:['lofi hip hop radio'],        yt:'uWzSqdcfPZw'},
  {name:'Bits & Hits: Gaming',  f:104.4, ch:'FantasyLofi',   match:['gaming lofi radio'],         yt:'Fo5BDohM9Fo'},
];
const MESSAGES = ['Just this one thing for now.', 'Small sessions add up. Keep showing up.', 'Phone face down.',
  'One focused hour beats three distracted ones.', 'Slow progress is still progress.', 'Read it, then explain it in your own words.',
  'Done beats perfect.', 'Sit up, breathe, back to it.', 'Every chapter is a step toward the next role.', 'You started. That was the hard part.'];
const MIN_LOG = 60e3, DAY = 864e5;
const focusMs = () => (S.pomoMin || 20) * 60e3;
const breakMs = () => ((S.pomoMin || 20) <= 20 ? 5 : 10) * 60e3;

// In the app, data lives in files the app reads and writes; in a browser it uses localStorage.
const NATIVE = !!window.__NATIVE;
const native = msg => { try { window.webkit.messageHandlers.native.postMessage(msg); } catch (e) {} };
if (!NATIVE) document.body.classList.add('preview');
const store = {
  get(k, d) { try { const v = NATIVE ? (window.__STORE || {})[k] : localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { const s = JSON.stringify(v); if (NATIVE) { native({type: 'store', key: k, value: s}); return; } try { localStorage.setItem(k, s); } catch (e) {} },
};
let logs = store.get('studyradio.logs', []);
// The dashboard window sends the log back when it deletes or restores a session.
window.__syncLogs = data => { logs = Array.isArray(data) ? data : []; renderStats(); };
const S = Object.assign({status: 'idle', mode: 'pomo', pomoMin: 20, startedAt: 0, segStart: 0, acc: 0, breakEnds: 0, station: 0, vol: .6, lastSeen: 0},
  store.get('studyradio.state', {}));
let radioOn = false, pending = null, breakOffer = 0, restored = false;
// A session that was running when the app quit resumes as paused, counting time up to the last heartbeat.
if (S.status === 'running') { S.acc += Math.max(0, (S.lastSeen || S.segStart) - S.segStart); S.status = 'paused'; restored = true; }
if (S.status === 'break' && Date.now() >= S.breakEnds) S.status = 'idle';
function saveState() { S.lastSeen = Date.now(); store.set('studyradio.state', S); }
function saveLogs() { store.set('studyradio.logs', logs); }
function elapsed() { return S.acc + (S.status === 'running' ? Date.now() - S.segStart : 0); }

/* ---------- formatting ---------- */
const pad = n => String(n).padStart(2, '0');
function clock(ms, withHours) {
  const t = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return withHours ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(h * 60 + m)}:${pad(s)}`;
}
function dur(ms) { const m = Math.round(ms / 60e3), h = Math.floor(m / 60); return h ? `${h}h ${m % 60}m` : `${m}m`; }
const dayStart = d => { d = new Date(d); return +new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const fmtTime = ts => new Date(ts).toLocaleTimeString(undefined, {hour: '2-digit', minute: '2-digit'});
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

/* ---------- messages ---------- */
let msgIdx = Math.floor(Math.random() * MESSAGES.length), msgTimer = 0;
// Notes show for a while, then the panel goes back to a rotating tip.
function say(text, hold = 6000) { $('#msg').textContent = text; clearTimeout(msgTimer); msgTimer = setTimeout(tip, hold); }
function tip() { clearTimeout(msgTimer); $('#msg').textContent = S.status === 'break' ? 'Stand up, stretch, drink some water.' : MESSAGES[msgIdx++ % MESSAGES.length]; msgTimer = setTimeout(tip, 15000); }

/* ---------- timer ---------- */
function start() {
  if (pending) return;
  if (S.status === 'running') return pause();
  breakOffer = 0; showView();
  if (S.status === 'idle' || S.status === 'break') { S.acc = 0; S.startedAt = Date.now(); }
  S.status = 'running'; S.segStart = Date.now();
  saveState(); render(); tip();
}
function pause() {
  if (S.status !== 'running') return;
  S.acc += Date.now() - S.segStart; S.status = 'paused';
  saveState(); render();
}
function stop() {
  if (S.status === 'idle') return;
  if (S.status === 'break') { S.status = 'idle'; saveState(); render(); say('Break skipped.', 3000); return; }
  const ms = elapsed(), st = S.startedAt;
  S.status = 'idle'; S.acc = 0; S.segStart = 0; S.startedAt = 0;
  saveState(); render();
  finish(st, ms);
}
function finish(startTs, ms) {
  if (ms < MIN_LOG) { say('Too short to log, under a minute.', 4000); return; }
  pending = {start: startTs, end: Date.now(), ms};
  openTopic();
}
// Count up, or Pomodoro 20, 40 or 60 minutes followed by a 5 or 10 minute break.
function setMode(m, min) {
  if (S.status !== 'idle') { say('Stop the timer before switching mode.', 3000); return; }
  S.mode = m;
  if (m === 'pomo') S.pomoMin = min || S.pomoMin || 20;
  saveState(); render();
}
function askBreak() {
  if (!breakOffer || pending) return;
  $('#breakText').textContent = `${S.pomoMin || 20} minutes of focus done. Take a ${Math.round(breakOffer / 60e3)} minute break?`;
  showView('break');
}
function takeBreak() {
  if (!breakOffer) return;
  S.status = 'break'; S.acc = 0; S.breakEnds = Date.now() + breakOffer; breakOffer = 0;
  saveState(); showView(); render(); tip();
}
function skipBreak() { breakOffer = 0; showView(); say('Break skipped. Start when you are ready.', 5000); }
function tick() {
  // A finished Pomodoro block stops the timer, opens the panel and asks what the session was, then about the break.
  if (S.mode === 'pomo' && S.status === 'running' && elapsed() >= focusMs()) {
    const st = S.startedAt, done = focusMs();
    chime();
    S.status = 'idle'; S.acc = 0; S.segStart = 0; S.startedAt = 0;
    saveState(); render();
    breakOffer = breakMs();
    native({type: 'notify', title: 'Focus block done', body: `${Math.round(done / 60e3)} minutes of focus. Log it and choose your break.`, show: true});
    finish(st, done);
  }
  if (S.status === 'break' && Date.now() >= S.breakEnds) {
    chime(); S.status = 'idle'; saveState(); render();
    native({type: 'notify', title: 'Break over', body: 'Start when you are ready for the next session.'});
    say('Break over. Start when you are ready.', 8000);
  }
  renderClock();
}
const PIE = ['○', '◔', '◑', '◕', '●'];   // empty, quarter, half, three quarters, full
let lastMenu = null;
function renderClock() {
  let ms, hours = false, p = 0;
  if (S.status === 'break') { ms = S.breakEnds - Date.now(); p = 1 - ms / breakMs(); }
  else if (S.mode === 'pomo') { ms = focusMs() - elapsed(); p = elapsed() / focusMs(); }
  else { ms = elapsed(); hours = ms >= 36e5; }
  p = Math.min(1, Math.max(0, p));
  const text = clock(ms, hours);
  $('#time').textContent = text; $('#time').classList.toggle('long', text.length > 5);
  $('#prog').style.width = (p * 100).toFixed(2) + '%';
  // The menu bar shows the time, with a filling circle for Pomodoro blocks and breaks.
  const pie = S.mode === 'pomo' || S.status === 'break' ? PIE[Math.min(4, Math.floor(p * 4 + .5))] + ' ' : '';
  const menu = S.status === 'idle' ? '' : (S.status === 'paused' ? '⏸ ' : pie) + text;
  if (menu !== lastMenu) { lastMenu = menu; native({type: 'clock', text: menu}); }
}
function render() {
  const st = S.status, pomo = S.mode === 'pomo';
  document.body.className = document.body.className.replace(/\b(running|paused|break|idle)\b/g, '').trim() + ' ' + st;
  $('#dot').className = st === 'idle' ? 'idle' : '';
  $('#state').textContent = st === 'running' ? (pomo ? `Focus · Pomodoro ${S.pomoMin}` : 'Focus · Counting up')
    : st === 'paused' ? 'Paused' : st === 'break' ? 'Short break' : 'Ready';
  $('#seg').hidden = $('#segGap').hidden = st !== 'idle';
  $('#seg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === (pomo ? String(S.pomoMin) : 'free')));
  $('#progWrap').hidden = st === 'idle' || (!pomo && st !== 'break');
  if (st === 'break') { $('#progA').textContent = 'Break'; $('#progB').textContent = `${Math.round(breakMs() / 60e3)} min`; }
  else if (S.startedAt) { $('#progA').textContent = `Started ${fmtTime(S.startedAt)}`; $('#progB').textContent = st === 'running' ? `Ends ${fmtTime(Date.now() + focusMs() - elapsed())}` : ''; }
  $('#primary').textContent = st === 'running' ? 'Pause' : st === 'paused' ? 'Resume' : 'Start Focus';
  $('#secondary').textContent = st === 'break' ? 'Skip Break' : 'Stop';
  $('#secWrap').hidden = st === 'idle';
  native({type: 'status', status: st});
  renderClock(); renderStats();
}

/* ---------- today, streak and week ---------- */
function renderStats() {
  const today = dayStart(Date.now()), now = new Date();
  const weekStart = today - ((now.getDay() + 6) % 7) * DAY;
  const sum = list => list.reduce((n, l) => n + l.ms, 0);
  const t = logs.filter(l => l.start >= today), w = logs.filter(l => l.start >= weekStart);
  $('#tToday').textContent = dur(sum(t)); $('#tTodayN').textContent = plural(t.length, 'session');
  $('#tWeek').textContent = dur(sum(w)); $('#tWeekN').textContent = plural(w.length, 'session');
  $('#tStreak').textContent = streak();
}
// Days in a row with at least one session, counting back from today (or from yesterday if today has none yet).
function streak() {
  const days = new Set(logs.map(l => dayStart(l.start)));
  let d = dayStart(Date.now()); if (!days.has(d)) d -= DAY;
  let n = 0; while (days.has(d)) { n++; d = dayStart(d - DAY / 2); }
  return n;
}

/* ---------- end-of-session questions ---------- */
function showView(which) {
  $('#main').hidden = !!which;
  $('#topicAsk').hidden = which !== 'topic';
  $('#breakAsk').hidden = which !== 'break';
}
function recentTopics(n = 5) {
  const seen = [];
  for (let i = logs.length - 1; i >= 0 && seen.length < n; i--) if (!seen.includes(logs[i].topic)) seen.push(logs[i].topic);
  return seen;
}
// "12m 30s of focus, 8:31 to 8:45 PM", naming paused time so the clock times add up.
function sessionLine(p) {
  const s = Math.round(p.ms / 1000), m = Math.floor(s / 60);
  const focus = m >= 60 ? dur(p.ms) : m >= 10 || !(s % 60) ? `${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`;
  const paused = p.end - p.start - p.ms;
  return `${focus} of focus${paused >= 60e3 ? `, ${dur(paused)} paused` : ''}, ${fmtTime(p.start)} to ${fmtTime(p.end)}`;
}
function openTopic() {
  $('#sessLine').textContent = sessionLine(pending);
  $('#chips').innerHTML = recentTopics().map(t => `<button type="button">${esc(t)}</button>`).join('');
  $('#topicList').innerHTML = [...new Set(logs.map(l => l.topic))].map(t => `<option value="${esc(t)}">`).join('');
  $('#topicInput').value = '';
  showView('topic');
  native({type: 'showPanel'});
  setTimeout(() => $('#topicInput').focus(), 80);
}
$('#chips').onclick = e => { const b = e.target.closest('button'); if (b) { $('#topicInput').value = b.textContent; $('#topicInput').focus(); } };
$('#topicAsk').addEventListener('submit', e => {
  e.preventDefault();
  const input = $('#topicInput'), topic = input.value.trim();
  if (!topic) { input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); input.focus(); return; }
  logs.push({id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), start: pending.start, end: pending.end, ms: pending.ms, topic});
  saveLogs(); pending = null; showView(); renderStats(); say('Good job!', 5000);
  askBreak();
});
$('#discardBtn').onclick = () => { pending = null; showView(); say('Session discarded.', 3000); askBreak(); };
$('#takeBreakBtn').onclick = takeBreak;
$('#skipBreakBtn').onclick = skipBreak;

/* ---------- sounds ---------- */
let ac;
function chime() {
  try {
    ac = ac || new AudioContext(); if (ac.state === 'suspended') ac.resume();
    [880, 1320].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * .22;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + 1.2);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 1.3);
    });
  } catch (e) {}
}

/* ---------- radio (official YouTube embed, shown small as the station art) ---------- */
const playSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const pauseSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
let yt = null, ytReady = null, ytPlayerReady = null;
const retried = {};
const ytId = st => (S.ytIds && S.ytIds[st.name]) || st.yt;
function loadYT() {
  if (!ytReady) ytReady = new Promise(resolve => {
    window.onYouTubeIframeAPIReady = resolve;
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api'; tag.onerror = () => resolve();
    document.head.append(tag);
  });
  return ytReady;
}
// YouTube starts a freshly created player muted (autoplay rules) but switches streams in an existing one with sound,
// so the player is created idle at launch and every play takes the switch-streams path.
function makePlayer() {
  if (!ytPlayerReady) ytPlayerReady = loadYT().then(() => new Promise(resolve => {
    if (!window.YT || !YT.Player) return resolve(null);
    yt = new YT.Player('ytFrame', {
      playerVars: {autoplay: 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1, rel: 0},
      events: {
        onReady: () => resolve(yt),
        onStateChange: e => {
          if (!radioOn) return;
          if (e.data === YT.PlayerState.PLAYING) { unmuteYT(); setTimeout(unmuteYT, 600); retried[STATIONS[S.station].name] = false; document.body.classList.add('playing'); }
          else if (e.data === YT.PlayerState.BUFFERING || e.data === YT.PlayerState.PAUSED) document.body.classList.remove('playing');
        },
        onError: () => { if (radioOn) ytFailed(); },
      },
    });
  }));
  return ytPlayerReady;
}
function unmuteYT() { if (!yt || !yt.isMuted) return; if (yt.isMuted()) yt.unMute(); yt.setVolume(Math.round(S.vol * 100)); }
async function playYT(id) {
  const player = await makePlayer();
  if (!radioOn) return;
  if (!player) { say('YouTube did not load. Check your connection.'); return; }
  player.unMute(); player.setVolume(Math.round(S.vol * 100)); player.loadVideoById(id);
}
function stopYT() { if (yt && yt.stopVideo) { try { yt.stopVideo(); } catch (e) {} } document.body.classList.remove('playing'); }
function resolveStation(i) { const st = STATIONS[i]; if (st.ch) native({type: 'resolve', i, ch: st.ch, match: st.match}); }
function ytResolved(i, id) {
  const st = STATIONS[i]; if (!st || !id) return;
  const changed = id !== ytId(st);
  S.ytIds = Object.assign({}, S.ytIds, {[st.name]: id}); saveState();
  if (changed && i === S.station && radioOn && retried[st.name]) playYT(id);
}
function ytFailed() {
  const st = STATIONS[S.station];
  if (NATIVE && st.ch && !retried[st.name]) { retried[st.name] = true; say(`Finding ${st.name}'s live stream...`, 5000); resolveStation(S.station); }
  else say(`${st.name} is not live right now. Try another station.`);
}
function tuneTo(i) {
  S.station = (i + STATIONS.length) % STATIONS.length; saveState();
  const st = STATIONS[S.station];
  $('#stName').textContent = st.name;
  $('#stSub').textContent = `FM ${st.f.toFixed(1)}`;
  $('#mark').textContent = st.name.split(':')[0].split(' ').map(w => w[0]).join('').slice(0, 2);
  if (radioOn) { document.body.classList.remove('playing'); playYT(ytId(st)); }
  reportStation();
}
function setRadio(on) {
  radioOn = on;
  $('#radioBtn').innerHTML = on ? pauseSvg : playSvg;
  if (on) tuneTo(S.station); else { stopYT(); reportStation(); }
}
function playStation(i) { if (!radioOn) { radioOn = true; $('#radioBtn').innerHTML = pauseSvg; } tuneTo(i); }
function reportStation() { native({type: 'station', i: S.station, on: radioOn, name: STATIONS[S.station].name}); }
$('#radioBtn').onclick = () => setRadio(!radioOn);
$('#prevSt').onclick = () => playStation(S.station - 1);
$('#nextSt').onclick = () => playStation(S.station + 1);
$('#vol').value = Math.round(S.vol * 100);
$('#vol').oninput = e => { S.vol = e.target.value / 100; if (yt && yt.setVolume) yt.setVolume(+e.target.value); saveState(); };

/* ---------- controls ---------- */
$('#primary').onclick = start;
$('#secondary').onclick = stop;
$('#seg').onclick = e => { const b = e.target.closest('button'); if (b) b.dataset.m === 'free' ? setMode('free') : setMode('pomo', +b.dataset.m); };
$('#gear').onclick = $('#openSettings').onclick = () => native({type: 'openDashboard', tab: 'settings'});
$('#openLog').onclick = () => native({type: 'openDashboard', tab: 'stats'});
$('#quit').onclick = () => native({type: 'quit'});
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); if ($('#main').hidden) return; start(); }
  if (e.key === 'Escape') native({type: 'hidePanel'});
});
// The app's window follows the panel's height.
new ResizeObserver(() => native({type: 'resize', h: Math.ceil($('#panel').getBoundingClientRect().height)})).observe($('#panel'));

/* ---------- boot ---------- */
setRadio(false);
tuneTo(S.station);
render();
if (restored) say('Timer paused while the app was closed. Press Resume.', 10000); else tip();
if (NATIVE) { STATIONS.forEach((st, i) => { if (st.ch) setTimeout(() => resolveStation(i), 400 * i); }); makePlayer(); }
setInterval(tick, 250);
setInterval(() => { if (S.status === 'running') saveState(); }, 5000);
addEventListener('pagehide', saveState);
// ?demo shows a session in progress, for screenshots; ?demo=break and ?demo=ask show those states.
const params = new URLSearchParams(location.search);
if (params.has('demo')) {
  const kind = params.get('demo');
  S.mode = 'pomo'; S.pomoMin = 40;
  const d0 = dayStart(Date.now()), mk = (day, h, min, topic) => ({id: day + '' + h, start: d0 - day * DAY + h * 36e5, end: d0 - day * DAY + h * 36e5 + min * 6e4, ms: min * 6e4, topic});
  logs = [mk(0, 0.1, 40, 'Security+ notes'), mk(0, 0.05, 40, 'Linear algebra'), mk(1, 9, 60, 'AWS AI Practitioner'), mk(2, 10, 40, 'Reading'), mk(3, 11, 60, 'System design')];
  if (kind === 'break') { S.status = 'break'; S.breakEnds = Date.now() + 4.4 * 60e3; }
  else if (kind === 'idle') { S.status = 'idle'; }
  else { S.status = 'running'; S.startedAt = S.segStart = Date.now() - (15 * 60 + 47) * 1000; S.acc = 0; }
  document.body.classList.toggle('playing', kind !== 'idle'); radioOn = kind !== 'idle'; $('#radioBtn').innerHTML = radioOn ? pauseSvg : playSvg;
  render(); tip();
  if (kind === 'ask') { pending = {start: Date.now() - 40 * 60e3, end: Date.now(), ms: 40 * 60e3}; openTopic(); }
}
</script>
</body>
</html>
